# Prometheus + Grafana dựng sẵn cho VM Monitor Portal.
#
#   1. Sửa prometheus/prometheus.yml: địa chỉ portal (targets)
#   2. Tạo file prometheus/portal_api_key.txt chứa API key vai trò "read" (Cài đặt -> Người dùng & API key)
#   3. Đặt mật khẩu admin Grafana trong file .env (GRAFANA_ADMIN_PASSWORD=...)
#   4. docker compose up -d
#   5. Mở http://IP_SERVER:3001  -> đăng nhập admin -> dashboard "VM Monitor Portal" đã có sẵn
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vmmon-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"      # chỉ mở cục bộ; Grafana gọi qua mạng nội bộ docker
    extra_hosts:
      - "host.docker.internal:host-gateway"   # khi portal chạy trên chính máy này

  grafana:
    image: grafana/grafana-oss:11.2.2
    container_name: vmmon-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Đặt GRAFANA_ADMIN_PASSWORD trong file .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/1-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus-data:
  grafana-data:
