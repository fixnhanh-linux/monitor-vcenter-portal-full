<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">Luồng số liệu VM Monitor</title><desc id="d">vCenter → agent → web-admin (lưu, cảnh báo, báo cáo) → dashboard, thông báo, Prometheus, InfluxDB.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:15px;font-weight:600} .s{font-size:12.5px} .lbl{font-size:12.5px;fill:#59636e} .ttl{font-size:18px;font-weight:600;fill:#1f2328}
.zone{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:5 5} .zl{font-size:12.5px;fill:#59636e;font-weight:600}
rect{stroke-width:1.2}
.fl{fill:none;stroke-width:2;stroke-dasharray:7 6;animation:run 1s linear infinite}
@keyframes run{to{stroke-dashoffset:-26}}
.bp rect{fill:#EEEDFE;stroke:#7F77DD} .bp .t{fill:#3C3489} .bp .s{fill:#534AB7}
.bt rect{fill:#E1F5EE;stroke:#1D9E75} .bt .t{fill:#085041} .bt .s{fill:#0F6E56}
.bg rect{fill:#F1EFE8;stroke:#888780} .bg .t{fill:#2C2C2A} .bg .s{fill:#5F5E5A}
.bc rect{fill:#FAECE7;stroke:#D85A30} .bc .t{fill:#712B13} .bc .s{fill:#993C1D}
.br rect{fill:#FCEBEB;stroke:#E24B4A} .br .t{fill:#791F1F} .br .s{fill:#A32D2D}
.fp{stroke:#7F77DD} .dp{fill:#7F77DD} .mp{fill:#7F77DD}
.ft{stroke:#1D9E75} .dt{fill:#1D9E75} .mt{fill:#1D9E75}
.fc{stroke:#D85A30} .dc{fill:#D85A30} .mc{fill:#D85A30}
.fr{stroke:#E24B4A} .dr{fill:#E24B4A} .mr{fill:#E24B4A}
.fg{stroke:#888780} .dg{fill:#888780} .mg{fill:#888780}
@media (prefers-color-scheme:dark){
.lbl,.zl{fill:#9198a1} .ttl{fill:#f0f6fc} .zone{stroke:#656c76}
.bp rect{fill:#3C3489;stroke:#7F77DD} .bp .t{fill:#CECBF6} .bp .s{fill:#AFA9EC}
.bt rect{fill:#085041;stroke:#1D9E75} .bt .t{fill:#9FE1CB} .bt .s{fill:#5DCAA5}
.bg rect{fill:#444441;stroke:#888780} .bg .t{fill:#D3D1C7} .bg .s{fill:#B4B2A9}
.bc rect{fill:#712B13;stroke:#D85A30} .bc .t{fill:#F5C4B3} .bc .s{fill:#F0997B}
.br rect{fill:#791F1F;stroke:#E24B4A} .br .t{fill:#F7C1C1} .br .s{fill:#F09595}
.fp{stroke:#AFA9EC} .dp{fill:#AFA9EC} .mp{fill:#AFA9EC}
.ft{stroke:#5DCAA5} .dt{fill:#5DCAA5} .mt{fill:#5DCAA5}
.fc{stroke:#F0997B} .dc{fill:#F0997B} .mc{fill:#F0997B}
.fr{stroke:#F09595} .dr{fill:#F09595} .mr{fill:#F09595}
.fg{stroke:#B4B2A9} .dg{fill:#B4B2A9} .mg{fill:#B4B2A9}
}
@media (prefers-reduced-motion:reduce){.fl{animation:none} .dot{display:none}}
</style><defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="mp"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="mt"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="mc"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="mr"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" class="mg"/></marker></defs><text class="ttl" x="450" y="34" text-anchor="middle">Luồng số liệu</text><g class="bg"><rect x="90" y="60" width="230" height="62" rx="10"/><text class="t" x="205.0" y="82.0" text-anchor="middle" dominant-baseline="central">vCenter</text><text class="s" x="205.0" y="103.0" text-anchor="middle" dominant-baseline="central">Bộ đếm hiệu năng 20 giây</text></g><path class="fl ft" d="M320 91 H396" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="1.2s" begin="0.00s" repeatCount="indefinite" path="M320 91 H396"/></circle><g class="bt"><rect x="400" y="60" width="230" height="62" rx="10"/><text class="t" x="515.0" y="82.0" text-anchor="middle" dominant-baseline="central">Agent Docker</text><text class="s" x="515.0" y="103.0" text-anchor="middle" dominant-baseline="central">Gom ~1.600 VM / lô</text></g><rect class="zone" x="60" y="156" width="780" height="236" rx="16"/><text class="zl" x="78" y="178" text-anchor="start">web-admin</text><path class="fl ft" d="M515 122 V200" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite" path="M515 122 V200"/></circle><text class="lbl" x="528" y="168">POST /api/v1/report</text><g class="bp"><rect x="400" y="204" width="230" height="62" rx="10"/><text class="t" x="515.0" y="226.0" text-anchor="middle" dominant-baseline="central">Nhận số liệu</text><text class="s" x="515.0" y="247.0" text-anchor="middle" dominant-baseline="central">Kiểm tra API key</text></g><path class="fl ft" d="M455 266 V290 H195 V310" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="2.0s" begin="0.00s" repeatCount="indefinite" path="M455 266 V290 H195 V310"/></circle><path class="fl ft" d="M515 266 V310" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="1.4s" begin="0.30s" repeatCount="indefinite" path="M515 266 V310"/></circle><path class="fl ft" d="M575 266 V290 H735 V310" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="2.0s" begin="0.60s" repeatCount="indefinite" path="M575 266 V290 H735 V310"/></circle><g class="bp"><rect x="90" y="314" width="210" height="62" rx="10"/><text class="t" x="195.0" y="336.0" text-anchor="middle" dominant-baseline="central">Lưu lịch sử</text><text class="s" x="195.0" y="357.0" text-anchor="middle" dominant-baseline="central">Điểm thô + trung bình 5′</text></g><g class="bp"><rect x="410" y="314" width="210" height="62" rx="10"/><text class="t" x="515.0" y="336.0" text-anchor="middle" dominant-baseline="central">Xét cảnh báo</text><text class="s" x="515.0" y="357.0" text-anchor="middle" dominant-baseline="central">Rule VM · host · datastore</text></g><g class="bp"><rect x="630" y="314" width="190" height="62" rx="10"/><text class="t" x="725.0" y="336.0" text-anchor="middle" dominant-baseline="central">Báo cáo tháng</text><text class="s" x="725.0" y="357.0" text-anchor="middle" dominant-baseline="central">Theo khách · 13 tháng</text></g><path class="fl fc" d="M450 392 V420" /><path class="fl fc" d="M450 420 H147 V448" marker-end="url(#ac)"/><circle class="dot dc" r="4.5"><animateMotion dur="1.8s" begin="0.00s" repeatCount="indefinite" path="M450 420 H147 V448"/></circle><path class="fl fc" d="M450 420 H352 V448" marker-end="url(#ac)"/><circle class="dot dc" r="4.5"><animateMotion dur="1.6s" begin="0.40s" repeatCount="indefinite" path="M450 420 H352 V448"/></circle><path class="fl fc" d="M450 420 H557 V448" marker-end="url(#ac)"/><circle class="dot dc" r="4.5"><animateMotion dur="1.6s" begin="0.80s" repeatCount="indefinite" path="M450 420 H557 V448"/></circle><path class="fl fc" d="M450 420 H752 V448" marker-end="url(#ac)"/><circle class="dot dc" r="4.5"><animateMotion dur="1.8s" begin="1.20s" repeatCount="indefinite" path="M450 420 H752 V448"/></circle><g class="bc"><rect x="60" y="452" width="175" height="62" rx="10"/><text class="t" x="147.5" y="474.0" text-anchor="middle" dominant-baseline="central">Dashboard</text><text class="s" x="147.5" y="495.0" text-anchor="middle" dominant-baseline="central">Realtime (SSE)</text></g><g class="bc"><rect x="255" y="452" width="195" height="62" rx="10"/><text class="t" x="352.5" y="474.0" text-anchor="middle" dominant-baseline="central">Thông báo</text><text class="s" x="352.5" y="495.0" text-anchor="middle" dominant-baseline="central">Telegram · email · webhook</text></g><g class="bc"><rect x="470" y="452" width="175" height="62" rx="10"/><text class="t" x="557.5" y="474.0" text-anchor="middle" dominant-baseline="central">Prometheus</text><text class="s" x="557.5" y="495.0" text-anchor="middle" dominant-baseline="central">Grafana · /metrics</text></g><g class="bc"><rect x="665" y="452" width="175" height="62" rx="10"/><text class="t" x="752.5" y="474.0" text-anchor="middle" dominant-baseline="central">InfluxDB</text><text class="s" x="752.5" y="495.0" text-anchor="middle" dominant-baseline="central">Line protocol</text></g></svg>
