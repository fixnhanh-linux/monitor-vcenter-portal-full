<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" role="img" aria-labelledby="t d"><title id="t">Kiến trúc tổng thể VM Monitor</title><desc id="d">Nhân viên dùng web-admin, khách dùng web-khach; agent tại mỗi site đọc vCenter và gửi về web-admin.</desc><style>
