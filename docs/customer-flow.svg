<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="t d"><title id="t">Yêu cầu của khách hàng qua web-khach</title><desc id="d">Danh sách trắng API, chỉ tài khoản khách, cookie riêng, web-admin lọc theo khách.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
