Motion dur="1.4s" begin="0.00s" repeatCount="indefinite" path="M550 211 H616"/></circle><g class="br"><rect x="620" y="180" width="200" height="62" rx="10"/><text class="t" x="720.0" y="202.0" text-anchor="middle" dominant-baseline="central">Không → 404</text><text class="s" x="720.0" y="223.0" text-anchor="middle" dominant-baseline="central">Cài đặt, host, /metrics…</text></g><path class="fl fp" d="M360 242 V272" marker-end="url(#ap)"/><circle class="dot dp" r="4.5"><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite" path="M360 242 V272"/></circle><g class="bp"><rect x="170" y="276" width="380" height="62" rx="10"/><text class="t" x="360.0" y="298.0" text-anchor="middle" dominant-baseline="central">Là tài khoản khách hàng?</text><text class="s" x="360.0" y="319.0" text-anchor="middle" dominant-baseline="central">Kiểm tra khi đăng nhập</text></g><path class="fl fr" d="M550 307 H616" marker-end="url(#ar)"/><circle class="dot dr" r="4.5"><animateMotion dur="1.4s" begin="0.40s" repeatCount="indefinite" path="M550 307 H616"/></circle><g class="br"><rect x="620" y="276" width="200" height="62" rx="10"/><text class="t" x="720.0" y="298.0" text-anchor="middle" dominant-baseline="central">Không → 403</text><text class="s" x="720.0" y="319.0" text-anchor="middle" dominant-baseline="central">Nhân viên, admin</text></g><path class="fl fp" d="M360 338 V368" marker-end="url(#ap)"/><circle class="dot dp" r="4.5"><animateMotion dur="1.0s" begin="0.30s" repeatCount="indefinite" path="M360 338 V368"/></circle><g class="bp"><rect x="170" y="372" width="380" height="62" rx="10"/><text class="t" x="360.0" y="394.0" text-anchor="middle" dominant-baseline="central">Cookie riêng kh_sess</text><text class="s" x="360.0" y="415.0" text-anchor="middle" dominant-baseline="central">Chuyển tiếp kèm IP thật</text></g><path class="fl ft" d="M360 434 V500" marker-end="url(#at)"/><circle class="dot dt" r="4.5"><animateMotion dur="1.4s" begin="0.00s" repeatCount="indefinite" path="M360 4